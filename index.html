<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8">

<title>Treino de força</title>

    box-sizing: border-box;
  }

  }

    margin: 0 0 12px;

  }

  h2 {
    margin: 0;
    font-size: 22px;
  }

  h3 {
    margin: 18px 0 8px;
    font-size: 17px;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .language-switch {
    display: flex;
    gap: 5px;
  }

  .lang-btn {
    border: 1px solid #ccc;
    background: white;
    color: #555;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  .lang-btn.active {
    background: #222;
    color: white;
    border-color: #222;
  }

  .week-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin: 14px 0;
  }

  .week-nav button,
  .clear-btn {
    border: 1px solid #ccc;
    background: white;
    color: #222;
    border-radius: 9px;
    padding: 9px 12px;
    cursor: pointer;
  }

  .week-nav button:hover,
  .clear-btn:hover {
    background: #eee;
  }

  .week-label {
    font-weight: bold;
    text-align: center;
  }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 18px;
  }

  .day-btn {
    border: 1px solid #ddd;
    background: white;
    border-radius: 9px;
    padding: 8px 3px;
    cursor: pointer;
    font-size: 12px;
  }

  .day-btn.active {
    background: #222;
    color: white;
    border-color: #222;
  }

  .day-name {
    font-weight: bold;
    display: block;
  }

  .day-date {
    display: block;
    margin-top: 2px;
    opacity: 0.8;
  }

  .session {
    background: white;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }

  .session-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }

  .session-title {
    font-size: 21px;
    font-weight: bold;
  }

  .session-type {
    font-size: 12px;
    color: #666;
    margin-top: 3px;
  }

  .complete-label {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    font-size: 13px;
  }

  .block {
    margin-top: 16px;
  }

  .block-title {
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 15px;
  }

  .exercise {
    border: 1px solid #e1e1e1;
    border-radius: 11px;
    padding: 12px;
    margin-bottom: 8px;
    background: #fafafa;
  }

  .exercise-top {
    display: flex;
    gap: 9px;
    align-items: flex-start;
  }

  .exercise-check {
    margin-top: 3px;
  }

  .exercise-name {
    font-weight: bold;
    flex: 1;
  }

  .prescription {
    color: #555;
    font-size: 13px;
    margin-top: 3px;
  }

  .video-button {
    display: inline-block;
    margin-top: 9px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 12px;
    cursor: pointer;
  }

    background: #eee;
  }

  .video-container {
    display: none;
    margin-top: 10px;
  }

  .video-container.show {
    display: block;
  }

  .video-container iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 9px;
  }

  .youtube-link {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    color: #b00000;
    text-decoration: none;
  }

  .youtube-link:hover {
    text-decoration: underline;
  }

  textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    border: 1px solid #ccc;
    border-radius: 9px;
    padding: 10px;
    font: inherit;
    font-size: 13px;
  }

  .set-guide {
    margin-top: 18px;
    padding: 14px;
    background: #f0f0f0;
    border-radius: 11px;
    font-size: 13px;
  }

  .set-guide strong:first-child {
    display: block;
    font-size: 15px;
    margin-bottom: 8px;
  }

    }

    .session {
      padding: 14px;
    }

    .session-header {
      flex-direction: column;
    }

    .complete-label {
      align-self: flex-start;
    }
  }
</style>
</head>

/* =========================================================
   DATE / WEEK
========================================================= */

let week = monday(new Date());

let activeIndex =
  Math.min((new Date().getDay() + 6) % 7, 6);

if (activeIndex === 6) {
  activeIndex = 0;
}


function monday(date) {

  const d = new Date(date);

  d.setHours(12, 0, 0, 0);

  const day = d.getDay();

  const diff =
    day === 0
      ? -6
      : 1 - day;

  d.setDate(d.getDate() + diff);

  return d;
}


function key(date) {
  return date.toISOString().slice(0, 10);
}


function dateLabel(date) {

  return date.toLocaleDateString(
    language === 'pt' ? 'pt-BR' : 'en-US',
    {
      day: '2-digit',
      month: '2-digit'
    }
  );
}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function storageKey(sessionId) {

  return `treino-${key(week)}-${sessionId}`;
}


function load(sessionId) {

  try {

    return JSON.parse(
      localStorage.getItem(storageKey(sessionId)) || '{}'
    );

  } catch {

    return {};
  }
}


function save(sessionId, data) {

  localStorage.setItem(
    storageKey(sessionId),
    JSON.stringify(data)
  );
}


/* =========================================================
   RENDER DAYS
========================================================= */

function renderDays() {

  const container =
    document.getElementById('days');

  container.innerHTML = '';

  for (let i = 0; i < 7; i++) {

    const date = new Date(week);

    date.setDate(
      week.getDate() + i
    );

    const button =
      document.createElement('button');

    button.className =
      'day-btn' +
      (i === activeIndex ? ' active' : '');

    button.innerHTML = `
      <span class="day-name">
        ${t('days')[i]}
      </span>

      <span class="day-date">
        ${dateLabel(date)}
      </span>
    `;

    button.onclick = () => {

      activeIndex = i;

      render();
    };

    container.appendChild(button);
  }
}

    .textContent = t('previous');

  document.getElementById('nextBtn')
    .textContent = t('next');

  document.getElementById('weekLabel')
    .textContent =
      `${t('days')[0]} ${dateLabel(week)} — ` +
      `${t('days')[6]} ${dateLabel(
        new Date(
          week.getFullYear(),
          week.getMonth(),
          week.getDate() + 6
        )
      )}`;

  document.getElementById('langPT')
    .classList.toggle(
      'active',
      language === 'pt'
    );

  document.getElementById('langEN')
    .classList.toggle(
      'active',
      language === 'en'
    );

  renderDays();

  const session =

      s => s.day === activeIndex
    );

    document.getElementById('app');

    app.innerHTML = '';

    return;
  }

  `;

            html += renderExercise(
              session,
              block,
              blockIndex,
              exercise,
              exerciseIndex,
              data
            );
          }
        );

        return;
      }


      html += `

        <div class="block">

          <div class="block-title">
            ${block.type}
          </div>

      `;


      block.exercises.forEach(
        (exercise, exerciseIndex) => {

          html += renderExercise(
            session,
            block,
            blockIndex,
            exercise,
            exerciseIndex,
            data
          );

        }
      );


      html += `
        </div>
      `;
    }
  );


  html += `

      <div class="block">

        <div class="block-title">
          ${t('observations')}
        </div>

        <textarea
          id="sessionNotes"
          placeholder="${t('notesPlaceholder')}"
        >${escapeHtml(data.sessionNotes || '')}</textarea>

      </div>

      <div class="block">

        <div class="block-title">
          ${t('sessionComments')}
        </div>

        <textarea
          id="sessionComments"
          placeholder="${t('commentsPlaceholder')}"
        >${escapeHtml(data.sessionComments || '')}</textarea>

      </div>


      <div class="set-guide">

        <strong>
          ${t('guideTitle')}
        </strong>

        <p>
          ${t('biSet')}
        </p>

        <p>
          ${t('triSet')}
        </p>

        <p>
          ${t('important')}
        </p>

      </div>

    </section>


    <div class="clear-area">

      <button
        class="clear-btn"
        onclick="clearWeek()"
      >
        ${t('clear')}
      </button>

    </div>

    <div class="saved-message">
      ${t('saved')}
    </div>
  `;


  app.innerHTML = html;


  /* SESSION COMPLETE */

  const complete =
    document.getElementById(
      'sessionComplete'
    );

  complete.addEventListener(
    'change',
    () => {

      const current =
        load(session.id);

      current.complete =
        complete.checked;

      save(
        session.id,
        current
      );
    }
  );


  /* NOTES */

  const notes =
    document.getElementById(
      'sessionNotes'
    );

  notes.addEventListener(
    'input',
    () => {

      const current =
        load(session.id);

      current.sessionNotes =
        notes.value;

      save(
        session.id,
        current
      );
    }
  );


  /* COMMENTS */

  const comments =
    document.getElementById(
      'sessionComments'
    );

  comments.addEventListener(
    'input',
    () => {

      const current =
        load(session.id);

      current.sessionComments =
        comments.value;

      save(
        session.id,
        current
      );
    }
  );


  /* EXERCISE CHECKBOXES */

  document
    .querySelectorAll(
      '.exercise-check'
    )
    .forEach(
      checkbox => {

        checkbox.addEventListener(
          'change',
          () => {

            const current =
              load(session.id);

            const exerciseKey =
              checkbox.dataset.exercise;

            if (!current.exercises) {
              current.exercises = {};
            }

            current.exercises[
              exerciseKey
            ] =
              checkbox.checked;

            save(
              session.id,
              current
            );
          }
        );
      }
    );


  /* VIDEO BUTTONS */

  document
    .querySelectorAll(
      '.video-button'
    )
    .forEach(
      button => {

        button.addEventListener(
          'click',
          () => {

            const id =
              button.dataset.video;

            const container =
              document.getElementById(
                `video-${id}`
              );

            if (
              container.classList.contains(
                'show'
              )
            ) {

              container.classList.remove(
                'show'
              );

              button.textContent =
                t('watchVideo');

            } else {

              container.classList.add(
                'show'
              );

              button.textContent =
                t('closeVideo');
            }
          }
        );
      }
    );
}


/* =========================================================
   EXERCISE HTML
========================================================= */

function renderExercise(
  session,
  block,
  blockIndex,
  exercise,
  exerciseIndex,
  data
) {

  const exerciseKey =
    `${blockIndex}-${exerciseIndex}`;

  const checked =
    data.exercises &&
    data.exercises[exerciseKey]
      ? 'checked'
      : '';

  const videoId =
    exercise.youtubeId;

  let videoHTML = '';

  if (videoId) {

    videoHTML = `

      <button
        type="button"
        class="video-button"
        data-video="${videoId}"
      >
        ${t('watchVideo')}
      </button>

      <div
        id="video-${videoId}"
        class="video-container"
      >

        <iframe
          src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0&playsinline=1"
          title="${escapeHtml(exercise.name[language])}"
          loading="lazy"
          allowfullscreen
        ></iframe>

        <a
          class="youtube-link"
          href="https://www.youtube.com/watch?v=${videoId}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${t('openYoutube')}
        </a>

      </div>
    `;
  }


  return `

    <div class="exercise">

      <div class="exercise-top">

        <input
          type="checkbox"
          class="exercise-check"
          data-exercise="${exerciseKey}"
          ${checked}
        >

        <div>

          <div class="exercise-name">
            ${exercise.name[language]}
          </div>

          <div class="prescription">
            ${exercise.prescription[language]}
          </div>

          ${videoHTML}

        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   WEEK NAVIGATION
========================================================= */

function changeWeek(direction) {

  week.setDate(
    week.getDate() +
    direction * 7
  );

  render();
}


/* =========================================================
   CLEAR WEEK
========================================================= */

function clearWeek() {

  const message =
    language === 'pt'
      ? 'Tem certeza que quer apagar todos os registros desta semana?'
      : 'Are you sure you want to delete all records from this week?';

  if (!confirm(message)) {
    return;
  }

  sessions.forEach(
    session => {

      localStorage.removeItem(
        storageKey(session.id)
      );
    }
  );

  render();
}


/* =========================================================
   LANGUAGE SWITCH
========================================================= */

function setLanguage(lang) {

  language = lang;

  localStorage.setItem(
    'treino-language',
    lang
  );

  render();
}


/* =========================================================
   SECURITY / TEXT ESCAPING
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


/* =========================================================
   START
========================================================= */

render();

</script>

</html>
