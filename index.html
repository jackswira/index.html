<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Treino de força</title>

  <style>
    :root {
      --bg: #f5f5f3;
      --card: #ffffff;
      --text: #202124;
      --muted: #6b6b6b;
      --border: #deded8;
      --accent: #222;
      --soft: #eeeeea;
      --today: #e8f0fe;
      --today-border: #8ab4f8;
      --success: #e8f5e9;
      --success-border: #81c784;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      line-height: 1.5;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    .app {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 20px 16px 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .language-toggle {
      display: flex;
      gap: 4px;
      background: var(--soft);
      padding: 4px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .language-toggle button {
      border: 0;
      background: transparent;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
    }

    .language-toggle button.active {
      background: white;
      color: var(--text);
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .week-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .week-navigation button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 9px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .week-navigation button:hover {
      background: var(--soft);
    }

    .week-label {
      text-align: center;
      font-weight: 700;
      font-size: 15px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }

    .day-button {
      position: relative;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 10px;
      padding: 9px 4px;
      cursor: pointer;
      color: var(--text);
      min-height: 56px;
      transition: .15s ease;
    }

    .day-button:hover {
      transform: translateY(-1px);
    }

    .day-button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .day-button.today {
      border-color: var(--today-border);
      box-shadow: inset 0 0 0 1px var(--today-border);
    }

    .day-button.active.today {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px var(--today-border);
    }

    .day-name {
      font-size: 12px;
      font-weight: 700;
    }

    .day-date {
      font-size: 12px;
      margin-top: 2px;
      opacity: .75;
    }

    .today-label {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--today-border);
      color: #17365d;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .session-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .session-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -.25px;
    }

    .session-type {
      display: inline-block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .complete-control {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      white-space: nowrap;
      color: var(--muted);
      cursor: pointer;
    }

    .complete-control input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #222;
    }

    .block {
      border-top: 1px solid var(--border);
      padding-top: 18px;
      margin-top: 18px;
    }

    .block:first-child {
      border-top: 0;
      padding-top: 0;
      margin-top: 0;
    }

    .block-header {
      margin-bottom: 14px;
    }

    .block-title {
      font-weight: 800;
      font-size: 15px;
    }

    .sequence {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .exercise-wrapper {
      display: flex;
      flex-direction: column;
    }

    .exercise {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #fff;
    }

    .exercise-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .exercise-check {
      padding-top: 2px;
      flex-shrink: 0;
    }

    .exercise-check input {
      width: 19px;
      height: 19px;
      accent-color: #222;
      cursor: pointer;
    }

    .exercise-main {
      min-width: 0;
      flex: 1;
    }

    .exercise-name {
      font-size: 15px;
      font-weight: 750;
      margin-bottom: 3px;
    }

    .exercise-prescription {
      color: var(--muted);
      font-size: 13px;
    }

    .exercise-actions {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .video-button {
      border: 1px solid var(--border);
      background: var(--soft);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 9px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .video-button:hover {
      background: #e4e4df;
    }

    .video-container {
      margin-top: 12px;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
    }

    .video-container iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    .video-fallback {
      padding: 10px;
      background: #f1f1ed;
      font-size: 12px;
    }

    .video-fallback a {
      color: inherit;
      font-weight: 700;
    }

    .exercise-notes {
      width: 100%;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      resize: vertical;
      min-height: 48px;
      color: var(--text);
      background: #fafaf8;
      font-size: 13px;
    }

    .exercise-notes:focus,
    .session-comments textarea:focus {
      outline: 2px solid #c9c9c3;
      border-color: #aaa;
    }

    .sequence-arrow {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 30px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }

    .rest-timer {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      background: #fafaf8;
      border-radius: 12px;
    }

    .timer-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }

    .timer-display {
      text-align: center;
      font-size: 38px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 8px 0 14px;
      font-variant-numeric: tabular-nums;
    }

    .timer-presets {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .timer-preset,
    .timer-control {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .timer-preset.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .timer-control.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .timer-status {
      text-align: center;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
      font-weight: 650;
    }

    .timer-status.finished {
      color: #286b35;
    }

    .session-comments {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .session-comments label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .session-comments textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fafaf8;
    }

    .guide {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }

    .guide h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .guide p {
      margin: 9px 0;
      font-size: 13px;
      color: var(--muted);
    }

    .guide strong {
      color: var(--text);
    }

    .clear-button {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .clear-button:hover {
      background: var(--soft);
      color: var(--text);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 20px;
    }

    .rest-day {
      text-align: center;
      padding: 25px 10px;
      color: var(--muted);
    }

    .rest-day-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    @media (max-width: 650px) {
      .app {
        padding: 16px 10px 40px;
      }

      header {
        align-items: center;
      }

      h1 {
        font-size: 24px;
      }

      .week-navigation {
        flex-direction: column;
      }

      .week-navigation button {
        width: 100%;
      }

      .week-label {
        order: -1;
      }

      .days {
        gap: 4px;
      }

      .day-button {
        min-height: 52px;
        padding: 7px 2px;
      }

      .day-name {
        font-size: 11px;
      }

      .day-date {
        font-size: 10px;
      }

      .session-card,
      .guide {
        padding: 16px;
        border-radius: 13px;
      }

      .session-header {
        flex-direction: column;
      }

      .session-title {
        font-size: 20px;
      }

      .complete-control {
        align-self: flex-start;
      }

      .today-label {
        font-size: 8px;
      }
    }

    @media (max-width: 420px) {
      .language-toggle button {
        padding: 6px 8px;
      }

      .days {
        margin-left: -2px;
        margin-right: -2px;
      }

      .day-button {
        border-radius: 8px;
      }
    }
  </style>
</head>

</div>

const timerStates = {};


function monday(date) {

  const d = new Date(date);

  d.setHours(12, 0, 0, 0);

  const day = d.getDay();

  const diff =
    day === 0
      ? -6
      : 1 - day;

  d.setDate(d.getDate() + diff);

  return d;
}


function key(date) {

  return date
    .toISOString()
    .slice(0, 10);

}


function dateLabel(date) {

  return date.toLocaleDateString(
    language === 'pt'
      ? 'pt-BR'
      : 'en-US',
    {
      day: '2-digit',
      month: '2-digit'
    }
  );

}


function storageKey(sessionId) {

  return `treino-${key(week)}-${sessionId}`;

}


function load(sessionId) {

  try {

    return JSON.parse(
      localStorage.getItem(
        storageKey(sessionId)
      ) || '{}'
    );

  } catch {

    return {};

  }

}


function save(sessionId, data) {

  localStorage.setItem(
    storageKey(sessionId),
    JSON.stringify(data)
  );

}


function getSessionData(sessionId) {

  const data = load(sessionId);

  if (!data.exercises) {
    data.exercises = {};
  }

  if (!data.comments) {
    data.comments = '';
  }

  if (typeof data.complete !== 'boolean') {
    data.complete = false;
  }

  return data;

}


function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function stopAllTimers() {

  Object.keys(timerStates).forEach(id => {

    if (timerStates[id]?.interval) {

      clearInterval(
        timerStates[id].interval
      );

    }

  });

}


function formatTime(seconds) {

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(minutes).padStart(2, '0') +
    ':' +
    String(secs).padStart(2, '0')
  );

}


function playBeep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const context =
      new AudioContext();

    const oscillator =
      context.createOscillator();

    const gain =
      context.createGain();

    oscillator.connect(gain);
    gain.connect(context.destination);

    oscillator.frequency.value = 880;
    oscillator.type = 'sine';

    gain.gain.setValueAtTime(
      0.001,
      context.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.2,
      context.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      context.currentTime + 0.4
    );

    oscillator.start();

    oscillator.stop(
      context.currentTime + 0.4
    );

  } catch {

    // Som opcional; não interrompe o aplicativo.

  }

}


function startTimer(timerId) {

  const state =
    timerStates[timerId];

  if (!state) {
    return;
  }

  if (state.remaining <= 0) {

    state.remaining =
      state.duration;

  }

  state.running = true;

  state.finished = false;

  updateTimerUI(timerId);

  if (state.interval) {

    clearInterval(
      state.interval
    );

  }

  state.interval =
    setInterval(() => {

      state.remaining--;

      if (state.remaining <= 0) {

        state.remaining = 0;

        state.running = false;

        state.finished = true;

        clearInterval(
          state.interval
        );

        state.interval = null;

        playBeep();

      }

      updateTimerUI(timerId);

    }, 1000);

}


function pauseTimer(timerId) {

  const state =
    timerStates[timerId];

  if (!state) {
    return;
  }

  state.running = false;

  if (state.interval) {

    clearInterval(
      state.interval
    );

    state.interval = null;

  }

  updateTimerUI(timerId);

}


function resetTimer(timerId) {

  const state =
    timerStates[timerId];

  if (!state) {
    return;
  }

  state.running = false;

  state.finished = false;

  state.remaining =
    state.duration;

  if (state.interval) {

    clearInterval(
      state.interval
    );

    state.interval = null;

  }

  updateTimerUI(timerId);

}


function setTimerDuration(timerId, seconds) {

  const state =
    timerStates[timerId];

  if (!state) {
    return;
  }

  state.duration = seconds;

  state.remaining = seconds;

  state.running = false;

  state.finished = false;

  if (state.interval) {

    clearInterval(
      state.interval
    );

    state.interval = null;

  }

  updateTimerUI(timerId);

}


function updateTimerUI(timerId) {

  const state =
    timerStates[timerId];

  const display =
    document.querySelector(
      `[data-timer-display="${timerId}"]`
    );

  const status =
    document.querySelector(
      `[data-timer-status="${timerId}"]`
    );

  const startButton =
    document.querySelector(
      `[data-timer-start="${timerId}"]`
    );

  if (!state) {
    return;
  }

  if (display) {

    display.textContent =
      formatTime(state.remaining);

  }

  if (status) {

    if (state.finished) {

      status.textContent =
        translations[language].finished;

      status.classList.add('finished');

    } else if (state.running) {

      status.textContent =
        translations[language].restTimer;

      status.classList.remove('finished');

    } else {

      status.textContent = '';

      status.classList.remove('finished');

    }

  }

  if (startButton) {

    startButton.textContent =
      state.running
        ? translations[language].pause
        : translations[language].start;

  }

  document
    .querySelectorAll(
      `[data-timer-preset-group="${timerId}"] .timer-preset`
    )
    .forEach(button => {

      button.classList.toggle(
        'active',
        Number(button.dataset.seconds) ===
        state.duration
      );

    });

}

function renderBlock(
  session,
  block,
  blockIndex
) {

  if (!block.exercises.length) {
    return '';

  const type =
    block.type;

  const sequence =
    type === 'Bi-set'
      ? 'A1 → A2 → Descanso → Repetir'
      : type === 'Tri-set'
        ? 'A1 → A2 → A3 → Descanso → Repetir'
        : '';

  let exercisesHtml = '';

  block.exercises.forEach(
    (exercise, index) => {

      exercisesHtml += `

        <div class="exercise-wrapper">

          ${renderExercise(
            session,
            block,
            exercise,
            index,
            blockIndex
          )}

      `;

      if (
        index <
        block.exercises.length - 1
      ) {

        exercisesHtml += `

          <div class="sequence-arrow">
            ↓
          </div>

        `;

      }

      exercisesHtml += `</div>`;

    }
  );


  let timerHtml = '';

  if (
    type === 'Bi-set' ||
    type === 'Tri-set'
  ) {

    const timerId =
      `${session.id}-timer-${blockIndex}`;

    timerHtml =
      createTimer(timerId);

  }


  return `

function renderDays() {

  const daysElement =
    document.getElementById('days');

  let html = '';

  const today =
    new Date();

  const currentWeek =
    monday(today);

  sessions.forEach(
    (session, index) => {

      const date =
        new Date(week);

      date.setDate(
        week.getDate() + index
      );

      const isToday =
        key(date) === key(today);

      const isCurrentWeek =
        key(week) === key(currentWeek);

      const isActive =
        index === activeIndex;

      const classes = [
        'day-button',
        isActive ? 'active' : '',
        isToday && isCurrentWeek
          ? 'today'
          : ''
      ]
        .filter(Boolean)
        .join(' ');

      html += `

        <button
          class="${classes}"
          type="button"
          data-day-index="${index}"
        >

          ${
            isToday && isCurrentWeek
              ? `
                <span class="today-label">
                  ${escapeHtml(
                    translations[language].today

                </span>
              `
              : ''
          }

          <div class="day-name">
            ${escapeHtml(
              translations[language].days[index]

          </div>

          <div class="day-date">

            container.innerHTML = `

              <iframe
                src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}"
                title="${escapeHtml(
                  translations[language].watchVideo
                )}"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
              ></iframe>

              <div class="video-fallback">

                <a
                  href="https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${escapeHtml(
                    translations[language].openYoutube
                  )}
                </a>

              </div>

            `;

            container.hidden =
              false;

            button.textContent =
              translations[language].closeVideo;

          } else {

            container.hidden =
              true;

            container.innerHTML =
              '';

            button.textContent =
              translations[language].watchVideo;

          }

        }
      );

    });


  document
    .querySelectorAll('[data-timer-start]')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          const timerId =
            button.dataset.timer;

          const state =
            timerStates[timerId];

          if (!state) {
            return;
          }

          if (state.running) {

            pauseTimer(
              timerId
            );

          } else {

            startTimer(
              timerId
            );

          }

        }
      );

    });


  document
    .querySelectorAll('[data-timer-reset]')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          resetTimer(
            button.dataset.timer
          );

        }
      );

    });


  document
    .querySelectorAll('[data-timer-preset]')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          setTimerDuration(
            button.dataset.timer,
            Number(button.dataset.seconds)
          );

        }
      );

    });


  document
    .querySelectorAll('[data-timer]')
    .forEach(button => {

      if (
        button.dataset.timer &&
        button.classList.contains('timer-preset')
      ) {
        return;
      }

    });

}


document
  .getElementById('previous-week')
  .addEventListener(
    'click',
    () => {

      stopAllTimers();

      week =
        new Date(week);

      week.setDate(
        week.getDate() - 7
      );

      activeIndex = 0;

      render();

    }
  );


document
  .getElementById('next-week')
  .addEventListener(
    'click',
    () => {

      stopAllTimers();

      week =
        new Date(week);

      week.setDate(
        week.getDate() + 7
      );

      activeIndex = 0;

      render();

    }
  );


document
  .getElementById('pt-button')
  .addEventListener(
    'click',
    () => {

      language = 'pt';

      localStorage.setItem(
        'treino-language',
        language
      );

      render();

    }
  );


document
  .getElementById('en-button')
  .addEventListener(
    'click',
    () => {

      language = 'en';

      localStorage.setItem(
        'treino-language',
        language
      );

      render();

    }
  );


document
  .getElementById('clear-week')
  .addEventListener(
    'click',
    () => {

      const message =
        language === 'pt'
          ? 'Tem certeza que deseja apagar todos os registros desta semana?'
          : 'Are you sure you want to delete all records from this week?';

      if (
        !window.confirm(message)
      ) {
        return;
      }

      sessions.forEach(
        session => {

          localStorage.removeItem(
            storageKey(session.id)
          );

        }
      );

      render();

    }
  );


window.addEventListener(
  'beforeunload',
  () => {

    stopAllTimers();

  }
);


render();

</script>

</body>
</html>
